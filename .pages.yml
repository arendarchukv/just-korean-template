# Pages CMS forms. Keep in step with src/content/schemas.ts (checked by pages-config.test.ts).
# Files to download (PDF, audio) are linked by their full https:// address; where they are stored
# (Cloudflare R2, Google Drive, ...) is not decided yet.
# Lesson images (cover, pictures in the text) are uploaded here and kept in the repository, where
# the build optimises them.
# Simple on purpose: no form points at another. A lesson carries its own words, quiz and files;
# the same parts can also be added on their own (Words, Quizzes, Materials) with the same fields.

components:
  level:
    type: select
    label: Level
    description: Who the content is for.
    options:
      values:
        - { name: beginner, label: Beginner }
        - { name: intermediate, label: Intermediate }
        - { name: advanced, label: Advanced }
  file:
    type: object
    label: File
    description: A file students can download.
    fields:
      - name: label
        label: Label
        type: string
        required: true
        description: What students see, e.g. "Worksheet" or "Transcript".
      - name: kind
        label: Type
        type: select
        required: true
        description: Shown as a small label on the download button.
        options:
          values:
            - { name: pdf, label: PDF }
            - { name: audio, label: Audio }
            - { name: transcript, label: Transcript }
      - name: url
        label: Link to the file
        type: string
        required: true
        description: The full link to the file, starting with https://
        pattern:
          regex: '^https://'
          message: The link must start with https://
  word:
    type: object
    label: Word
    description: One flashcard. Korean on the front, meaning on the back.
    fields:
      - name: front
        label: Korean
        type: string
        required: true
        description: Korean word or phrase.
      - name: back
        label: Meaning
        type: string
        required: true
        description: What it means.
      - name: example
        label: Example
        type: string
        description: Example sentence (optional).
  question:
    type: block
    label: Question
    description: Multiple choice or fill in the gap.
    blockKey: type
    blocks:
      - name: choice
        label: Multiple choice
        fields:
          - name: prompt
            label: Question
            type: string
            required: true
            description: The question or sentence.
          - name: options
            label: Options
            type: object
            description: Tick the correct one.
            list: { min: 2 }
            fields:
              - name: text
                label: Option
                type: string
                required: true
                description: Option text.
              - name: correct
                label: Correct
                type: boolean
                description: Tick if this option is correct.
          - name: explanation
            label: Explanation
            type: text
            description: Shown after answering (optional).
      - name: fill
        label: Fill in the gap
        fields:
          - name: sentence
            label: Sentence
            type: string
            required: true
            description: Sentence with the gap written as ___ (three underscores).
            pattern: { regex: '___', message: Mark the gap with ___ (three underscores) }
          - name: answer
            label: Answer
            type: string
            required: true
            description: The correct answer.
          - name: alternatives
            label: Other accepted answers
            type: string
            list: true
            description: Another accepted answer (optional).
          - name: explanation
            label: Explanation
            type: text
            description: Shown after answering (optional).

# Lesson images. `output` is written into the lesson file: a path from src/content/lessons/ to the
# image, which Astro resolves and optimises at build.
media:
  - name: lessons
    label: Lesson images
    input: src/assets/lessons
    output: ../../assets/lessons
    categories: [image]
    rename: safe

content:
  - name: lessons
    label: Lessons
    type: collection
    path: src/content/lessons
    format: yaml-frontmatter
    # The file is named after the Page address field (Korean titles cannot name files).
    filename: { template: '{fields.address}.md', field: false }
    view:
      fields: [title, date, playlist]
      primary: title
      search: [title, summary]
      sort: [date, title]
      default: { sort: date, order: desc }
    fields:
      - name: address
        label: Page address
        type: string
        required: true
        description: The end of the page's web address, e.g. ge-vs-dorok gives /lessons/ge-vs-dorok/. Small Latin letters, digits and dashes. Set it when creating; changing it later does not move the page.
        pattern:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
          message: Use small Latin letters, digits and single dashes, e.g. winter-snacks
      - name: title
        label: Title
        type: string
        required: true
        description: The lesson title, as on YouTube.
      - name: youtube
        label: YouTube video
        type: string
        description: Paste the YouTube link (or the 11-character video id). Leave empty for a lesson without a video.
        pattern:
          { regex: '(youtube\.com/|youtu\.be/|^[\w-]{11}$)', message: Paste a YouTube video link }
      - name: cover
        label: Cover image
        type: image
        description: A picture for the card and the top of the lesson (wide, 16:9 works best). A lesson with a video shows the video instead, and the picture only on its card when it has no video.
        options: { media: lessons }
      - name: playlist
        label: Playlist
        type: select
        description: The playlist it belongs to (optional). A course is shown in date order.
        options:
          values:
            - { name: crash-course, label: Beginner Korean Crash Course }
            - { name: grammar, label: Grammar }
            - { name: speaking, label: Speaking like a Korean }
            - { name: vocabulary, label: Vocabulary }
            - { name: pronunciation, label: Pronunciation }
            - { name: shadowing, label: Shadowing }
            - { name: podcast, label: Podcast & listening }
            - { name: reading, label: Reading }
            - { name: culture, label: Korean culture & K-pop }
      - name: date
        label: Date
        type: date
        required: true
        description: Publication date; the home page shows the newest lessons first.
        options: { format: yyyy-MM-dd }
      - name: level
        component: level
        required: true
      - name: summary
        label: Summary
        type: text
        description: One or two sentences for cards and search results.
      - name: story
        label: Reading text
        description: One part of a text to read, e.g. a story (optional).
        list: { collapsible: { collapsed: true, summary: '{title}' } }
        type: object
        fields:
          - name: title
            label: Heading
            type: string
            description: A short Korean heading for this part (optional).
          - name: text
            label: Korean text
            type: text
            required: true
            description: The Korean text of this part. A blank line starts a new paragraph.
          - name: translation
            label: Translation
            type: text
            description: English translation of this part (optional), shown on request.
      - name: grammar
        label: Grammar patterns
        type: string
        list: true
        description: A pattern this lesson explains, as students search for it, e.g. -게.
      - name: words
        component: word
        label: Words
        description: A flashcard for this lesson (also on Practice).
        list: { collapsible: { collapsed: true, summary: '{front}' } }
      - name: quiz
        component: question
        label: Quiz
        description: A question for this lesson (also on Practice).
        list: true
      - name: files
        component: file
        label: Files
        description: A file for this lesson (also on Materials).
        list: { collapsible: { collapsed: true, summary: '{label}' } }
      - name: body
        type: rich-text
        label: Lesson text
        description: Explanation or transcript shown on the lesson page. The image button adds a picture to the text.
        options: { format: markdown, media: lessons }

  - name: decks
    label: Words
    type: collection
    path: src/content/decks
    format: yaml
    filename: { template: '{fields.address}.yml', field: false }
    view: { fields: [title, level], primary: title, search: [title] }
    fields:
      - name: address
        label: Page address
        type: string
        required: true
        description: The end of the page's web address, e.g. winter-snacks gives /practice/deck/winter-snacks/. Small Latin letters, digits and dashes. Set it when creating; changing it later does not move the page.
        pattern:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
          message: Use small Latin letters, digits and single dashes, e.g. winter-snacks
      - name: title
        label: Title
        type: string
        required: true
        description: Deck name, e.g. "Winter snacks".
      - name: level
        component: level
        required: true
      - name: description
        label: Description
        type: text
        description: One sentence about the deck (optional).
      - name: cards
        component: word
        label: Words
        description: A flashcard, Korean on the front and meaning on the back.
        list: { min: 1, collapsible: { collapsed: true, summary: '{front}' } }

  - name: quizzes
    label: Quizzes
    type: collection
    path: src/content/quizzes
    format: yaml
    filename: { template: '{fields.address}.yml', field: false }
    view: { fields: [title, level], primary: title, search: [title] }
    fields:
      - name: address
        label: Page address
        type: string
        required: true
        description: The end of the page's web address, e.g. particles-check gives /practice/quiz/particles-check/. Small Latin letters, digits and dashes. Set it when creating; changing it later does not move the page.
        pattern:
          regex: '^[a-z0-9]+(-[a-z0-9]+)*$'
          message: Use small Latin letters, digits and single dashes, e.g. winter-snacks
      - name: title
        label: Title
        type: string
        required: true
        description: Quiz title.
      - name: level
        component: level
        required: true
      - name: questions
        component: question
        label: Questions
        description: Multiple choice or fill in the gap.
        list: { min: 1 }

  - name: materials
    label: Materials
    type: collection
    path: src/content/materials
    format: yaml
    # Named by the moment it is created: no page of its own, so no address to choose.
    filename: { template: '{year}-{month}-{day}-{hour}{minute}{second}.yml', field: false }
    view:
      {
        fields: [title, section, date],
        primary: title,
        search: [title],
        default: { sort: date, order: desc },
      }
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Title students see in the materials table.
      - name: section
        label: Tab
        type: select
        required: true
        description: The tab on the Materials page.
        options:
          values:
            - { name: class, label: Class materials (수업 보조 자료) }
            - { name: podcast, label: Podcast (팟캐스트 자료) }
            - { name: self-study, label: Self-study (공부 자료) }
      - name: type
        label: Type
        type: select
        required: true
        description: What kind of material it is; students can filter by it.
        options:
          values:
            - { name: reading, label: Reading (읽기) }
            - { name: writing, label: Writing (쓰기) }
            - { name: listening, label: Listening (듣기) }
            - { name: vocabulary, label: Vocabulary (단어) }
            - { name: video, label: Video (영상) }
      - name: date
        label: Date
        type: date
        required: true
        description: Date the material was added; newest first.
        options: { format: yyyy-MM-dd }
      - name: files
        component: file
        label: Files
        description: A file to download.
        list: { min: 1, collapsible: { collapsed: true, summary: '{label}' } }

  - name: notices
    label: Notices
    type: collection
    path: src/content/notices
    format: yaml
    # Named by the moment it is created: no page of its own, so no address to choose.
    filename: { template: '{year}-{month}-{day}-{hour}{minute}{second}.yml', field: false }
    view: { fields: [title, from, to, tone], primary: title, default: { sort: from, order: desc } }
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Short headline, e.g. "Winter break".
      - name: text
        label: Text
        type: text
        required: true
        description: One line shown in the strip at the top of the site.
      - name: from
        label: Show from
        type: date
        required: true
        description: First day the notice is shown.
        options: { format: yyyy-MM-dd }
      - name: to
        label: Show until
        type: date
        description: Last day the notice is shown; it disappears after this day. Leave empty to keep it until you delete it (e.g. a greeting).
        options: { format: yyyy-MM-dd }
      - name: tone
        label: Colour
        type: select
        required: true
        description: 'Colour and order in the strip: Important (red) first, then News (green), then Info (blue).'
        options:
          values:
            - { name: important, label: 'Important (red), e.g. no classes for a while' }
            - { name: news, label: 'News (green), e.g. a new site or a new group' }
            - { name: info, label: 'Info (blue), e.g. a timetable change' }
      - name: pinned
        label: Pinned
        type: boolean
        description: Always show it during its dates; students cannot close it. Leave off for notices they may dismiss.
      - name: link
        label: Details link
        type: string
        description: Optional link for "Details", e.g. /classes/ or a full https:// link.
        pattern:
          {
            regex: '^(https://|/)',
            message: Use a site path like /classes/ or a full https:// link,
          }

  - name: site
    label: Site settings
    type: file
    path: src/content/settings/site.yml
    format: yaml
    fields:
      - name: tidycal
        label: TidyCal booking link
        type: string
        description: Your TidyCal booking link; "Book a class" buttons open it.
        pattern: { regex: '^https://', message: The link must start with https:// }
      - name: contactForm
        label: Contact form (Tally)
        type: string
        description: Tally contact form link.
        pattern: { regex: '^https://', message: The link must start with https:// }
      - name: holiday
        label: Holiday decorations
        type: select
        description: Small decorations and a greeting for a Korean holiday. Automatic shows each holiday on its dates; a holiday chosen here shows until you change it.
        options:
          values:
            - { name: none, label: None }
            - { name: auto, label: Automatic by date }
            - { name: seollal, label: Seollal (설날) }
            - { name: chuseok, label: Chuseok (추석) }
            - { name: christmas, label: Christmas }
            - { name: hangeulnal, label: Hangul Day (한글날) }
            - { name: gwangbokjeol, label: Liberation Day (광복절) }
      - name: social
        label: Footer links
        type: object
        description: Links in the footer. Leave empty to hide.
        fields:
          - name: youtube
            label: YouTube channel
            type: string
            description: YouTube channel link.
            pattern: { regex: '^https://', message: The link must start with https:// }
          - name: instagram
            label: Instagram
            type: string
            description: Instagram profile link.
            pattern: { regex: '^https://', message: The link must start with https:// }
          - name: kofi
            label: Ko-fi
            type: string
            description: Ko-fi page link.
            pattern: { regex: '^https://', message: The link must start with https:// }
