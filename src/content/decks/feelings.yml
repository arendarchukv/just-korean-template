title: Feelings that are hard to translate
level: intermediate
description: Words Koreans use every day that have no one-word English match.
cards:
  - front: 설레다
    back: To feel a flutter of excitement
    example: 내일 여행 가서 너무 설레요.
  - front: 답답하다
    back: To feel stuffy or frustrated
  - front: 아쉽다
    back: To feel it is a pity; to wish it were more
    example: 벌써 끝나서 아쉬워요.
  - front: 서운하다
    back: To feel let down by someone close
  - front: 뿌듯하다
    back: To feel proud and fulfilled
